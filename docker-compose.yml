services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fichas_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg16
    container_name: fichas_db_local
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fichas_dev
    volumes:
      - fichas_db_data:/var/lib/postgresql/data

volumes:
  fichas_db_data:
